<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary SEO Meta Tags -->
    <title>Variety Store - Online Grocery & Household Essentials Delivery</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://aditya-variety.vercel.app/">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GroceryStore",
      "name": "Variety Store",
      "description": "Your friendly neighborhood store for groceries, household essentials, snacks & more.",

      "telephone": "+91-98765-43210",
      "email": "hello@varietystore.in",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Main Street",
        "addressLocality": "Your City",
        "addressRegion": "State",
        "postalCode": "123456",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "0.000000",
        "longitude": "0.000000"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],

      "currenciesAccepted": "INR",

        "@type": "City",
        "name": "Your City"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Product Categories",
        "itemListElement": [
          {"@type": "OfferCatalog", "name": "Groceries"},
          {"@type": "OfferCatalog", "name": "Household Essentials"},
          {"@type": "OfferCatalog", "name": "Snacks & Beverages"},
          {"@type": "OfferCatalog", "name": "Personal Care"},
          {"@type": "OfferCatalog", "name": "Stationery"}
        ]
      }
